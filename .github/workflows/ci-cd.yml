name: CI/CD - Blue/Green Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ${{ github.repository }}
  APP_NAME: test_dockploy-2
  SERVER_IP: 10.117.66.20
  SSH_USER: root
  PORT_BLUE: "3099"
  PORT_GREEN: "3100"

jobs:
  # ---------- CI: lint + build ----------
  test:
    runs-on: ubuntu-latest
    outputs:
      build_ok: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Print build result
        run: echo "✅ CI tests passed"

  # ---------- Build & push Docker image to GHCR ----------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,prefix=${{ github.sha }}-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image refs
        run: |
          echo "Pushed image tags: ${{ steps.meta.outputs.tags }}"

  # ---------- Deploy to 10.117.66.20 (self-hosted runner on server) ----------
  deploy:
    needs: build-and-push
    runs-on: self-hosted   # runner must be installed on 10.117.66.20
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR on self-hosted runner
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Pull latest image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:${{ github.sha }}

      - name: Detect active version
        id: detect
        run: |
          CURRENT="blue"
          if grep -q "server app-green:3000;" nginx/nginx.conf 2>/dev/null; then
            CURRENT="green"
          fi
          if [ "$CURRENT" = "blue" ]; then TARGET="green"; else TARGET="blue"; fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          if [ "$TARGET" = "green" ]; then echo "port=${PORT_GREEN}"; else echo "port=${PORT_BLUE}"; fi >> $GITHUB_OUTPUT

      - name: Deploy target version
        env:
          TARGET_VERSION: ${{ steps.detect.outputs.target }}
          TARGET_PORT: ${{ steps.detect.outputs.port }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:${{ github.sha }}"
          docker rm -f "${{ env.APP_NAME }}-${TARGET_VERSION}" 2>/dev/null || true
          docker run -d --name "${{ env.APP_NAME }}-${TARGET_VERSION}" \
            -p "${TARGET_PORT}:3000" \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e NEXT_PUBLIC_APP_URL="http://${{ env.SERVER_IP }}:${TARGET_PORT}" \
            "$IMAGE"

      - name: Wait and switch nginx
        run: |
          sleep 3
          TARGET="${{ steps.detect.outputs.target }}"
          sed -i "s|server app-[a-z]*:3000;|server app-${TARGET}:3000;|g" nginx/nginx.conf
          docker exec "${{ env.APP_NAME }}-nginx" nginx -s reload 2>/dev/null \
            || docker restart "${{ env.APP_NAME }}-nginx"

      - name: Verify through nginx
        run: |
          if curl -sf "http://127.0.0.1:80/healthz" > /dev/null; then
            echo "✅ Deployment successful (nginx on :80)"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Stop old version
        run: |
          CURRENT="${{ steps.detect.outputs.current }}"
          docker rm -f "${{ env.APP_NAME }}-${CURRENT}" 2>/dev/null || true
          echo "🧹 Removed old ${CURRENT} version"

  notify:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "Pipeline finished: ${{ needs.deploy.result }}"