name: CI/CD - Blue/Green Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SERVER_IP: 10.117.66.20
  SSH_USER: root
  APP_NAME: test_dockploy-2
  DOCKER_REGISTRY: localhost:5000
  PORT_GREEN: "3099"
  PORT_BLUE: "3098"
  # Blue is default, Green is new deployment

jobs:
  # ---------- Build & Push ----------
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      green_image: ${{ steps.meta.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image (Green)
        id: build-green
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${APP_NAME}:green-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${APP_NAME}:green-cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${APP_NAME}:green-cache,mode=max

      - name: Build and push Docker image (Blue)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${APP_NAME}:blue-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${APP_NAME}:blue-cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${APP_NAME}:blue-cache,mode=max

      - name: Export image tags
        id: meta
        run: |
          echo "green_image=${APP_NAME}:green-${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------- Deploy ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH into server
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Copy compose file and env
          source: ".env docker-compose.yml nginx/"
          target: "/opt/${{ env.APP_NAME }}/"

      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/${APP_NAME}
            
            # Pull latest images
            docker pull ${{ env.DOCKER_REGISTRY }}/${APP_NAME}:green-${{ github.sha }}
            docker pull ${{ env.DOCKER_REGISTRY }}/${APP_NAME}:blue-${{ github.sha }}
            
            # Stop current running version
            if [ "$(docker ps -q -f name=${APP_NAME}-blue)" ]; then
              docker stop ${APP_NAME}-blue
              docker rm ${APP_NAME}-blue
            fi
            
            # Start new Green version on port 3099
            docker run -d --name ${APP_NAME}-green \\
              -p ${{ env.PORT_GREEN }}:3000 \\
              -e NODE_ENV=production \\
              -e PORT=3000 \\
              -e NEXT_PUBLIC_APP_URL=http://${SERVER_IP}:${env.PORT_GREEN} \\
              ${{ env.DOCKER_REGISTRY }}/${APP_NAME}:green-${{ github.sha }}
            
            # Update nginx to point to Green
            cat > nginx/nginx.conf << 'NGINXEOF'
events {}

http {
    upstream app {
        server app:${PORT_GREEN};
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/events {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/upload {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            client_max_body_size 100M;
        }

        location /files/ {
            alias /usr/share/nginx/html/uploads/;
            proxy_buffering off;
            proxy_cache off;
            add_header Cache-Control "public, max-age=31536000";
        }
    }
}
NGINXEOF

            # Reload nginx
            docker kill -s HUP $(cat /var/run/nginx.pid 2>/dev/null) 2>/dev/null || true
            docker restart ${APP_NAME}-nginx 2>/dev/null || true

            # Verify
            curl -f http://${SERVER_IP}:80/healthz && echo "Deployment successful!" || echo "Health check failed"

  # ---------- Notification ----------
  notify:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: echo "✅ Deployment pipeline completed"