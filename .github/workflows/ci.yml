name: CI/CD - Test, Build, Deploy to Dokploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: CI passed
        run: echo "Tests and build succeeded"

  deploy:
    name: Trigger Dokploy Deploy
    needs: ci
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          echo "URL: $DOKPLOY_URL"
          echo "API_KEY length: ${#DOKPLOY_API_KEY}"
          echo "COMPOSE_ID: $DOKPLOY_COMPOSE_ID"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${DOKPLOY_URL}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Dokploy deploy triggered"
          else
            echo "Dokploy deploy failed"
            exit 1
          fi