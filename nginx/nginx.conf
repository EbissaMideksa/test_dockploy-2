events {}

http {
    # Upstream blocks for blue/green switching
    upstream blue {
        server app-blue:3000;
        keepalive 64;
    }

    upstream green {
        server app-green:3000;
        keepalive 64;
    }

    # Map to control which upstream receives traffic
    # Set $traffic_version to 'blue' or 'green'
    map $http_x_traffic $traffic_version {
        default blue;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        # Gzip compression
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_types
            application/javascript
            application/json
            application/xml
            image/svg+xml
            text/css
            text/javascript
            text/plain
            text/xml;

        # Static assets caching - from blue version
        location /_next/static/ {
            proxy_pass http://blue;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public assets - from blue version
        location /public/ {
            proxy_pass http://blue;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js Image Optimization API
        location /_next/image {
            proxy_pass http://$traffic_version;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main application - routes to $traffic_version upstream
        location / {
            proxy_pass http://$traffic_version;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Blue/green switch endpoint (internal only)
        location = /switch-blue {
            allow 127.0.0.1;
            allow 10.117.66.20;
            deny all;
            return 200 "switched to blue";
        }

        location = /switch-green {
            allow 127.0.0.1;
            allow 10.117.66.20;
            deny all;
            return 200 "switched to green";
        }
    }
}